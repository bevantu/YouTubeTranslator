<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Bilingual Subtitles</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="popup-brand">
        <img src="../icons/icon48.png" alt="" width="32" height="32">
        <div>
          <h1>YT Bilingual</h1>
          <span id="versionText">v1.1.0</span>
        </div>
      </div>
      <label class="switch" title="Enable extension">
        <span class="sr-only">Enable bilingual subtitles</span>
        <input type="checkbox" id="enableToggle" checked>
        <span aria-hidden="true"></span>
      </label>
    </header>

    <main class="popup-body">
      <section class="status-card" id="statusSection" data-state="waiting" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <div class="status-copy">
          <strong id="statusTitle">Checking video...</strong>
          <span id="statusDetail"></span>
        </div>
        <button type="button" id="statusAction" class="text-button" hidden></button>
      </section>

      <section class="popup-section">
        <h2>Subtitle display</h2>
        <div class="mode-control" id="displayMode" role="group" aria-label="Subtitle display mode">
          <button type="button" data-mode="original" aria-pressed="false">Original</button>
          <button type="button" class="active" data-mode="bilingual" aria-pressed="true">Bilingual</button>
          <button type="button" data-mode="translated" aria-pressed="false">Translation</button>
        </div>
      </section>

      <section class="popup-section compact-grid">
        <div>
          <label for="targetLanguage">Caption language</label>
          <select id="targetLanguage">
            <option value="en">English</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ru">Russian</option>
            <option value="pt">Portuguese</option>
            <option value="it">Italian</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
            <option value="th">Thai</option>
            <option value="vi">Vietnamese</option>
            <option value="tr">Turkish</option>
          </select>
        </div>
        <div>
          <label for="nativeLanguage">Translate to</label>
          <select id="nativeLanguage">
            <option value="zh">Chinese</option>
            <option value="en">English</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="ru">Russian</option>
            <option value="pt">Portuguese</option>
            <option value="it">Italian</option>
          </select>
        </div>
      </section>

      <section class="popup-section">
        <label for="proficiencyLevel">Vocabulary level</label>
        <select id="proficiencyLevel">
          <option value="none">No automatic known words</option>
          <option value="primary">Primary school</option>
          <option value="middle" selected>Middle school</option>
          <option value="high">High school</option>
          <option value="cet4">CET-4</option>
          <option value="cet6">CET-6</option>
        </select>
      </section>

      <section class="popup-section setting-list">
        <label class="setting-row" for="useAITranslation">
          <span><strong>AI translation</strong><small>Off uses YouTube translation</small></span>
          <input class="switch-input" type="checkbox" id="useAITranslation">
        </label>
        <label class="setting-row" for="webPageTranslation">
          <span><strong>Webpage translation</strong><small>Translate supported pages</small></span>
          <input class="switch-input" type="checkbox" id="webPageTranslation">
        </label>
      </section>

      <div class="popup-actions">
        <button type="button" id="togglePanel" class="button secondary">Subtitle panel</button>
        <button type="button" id="openSettings" class="button primary">Full settings</button>
      </div>

      <div class="popup-stats" aria-label="Vocabulary statistics">
        <div><strong id="learningStat">0</strong><span>Learning</span></div>
        <div><strong id="masteredStat">0</strong><span>Mastered</span></div>
      </div>
    </main>
  </div>

  <script src="../lib/wordlevels.js"></script>
  <script src="../lib/languages.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
